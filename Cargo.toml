[workspace]
resolver = "2"
members = [
    "crates/mayhem-bridge",
    "crates/mayhem-cli",
    "crates/mayhem-enclave",
    "crates/mayhem-engine",
    "crates/mayhem-gateway",
    "crates/mayhem-hwprobe",
    "crates/mayhem-pay",
    "crates/mayhem-proto",
    "crates/mayhem-windows-sandbox",
    "crates/mayhemd",
    "services/paygate",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

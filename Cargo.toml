[workspace]
resolver = "2"
members = [
    "crates/mayhem-attestation",
    "crates/mayhem-attestation-verifier",
    "crates/mayhem-bridge",
    "crates/mayhem-cli",
    "crates/mayhem-enclave",
    "crates/mayhem-engine",
    "crates/mayhem-gateway",
    "crates/mayhem-hwprobe",
    "crates/mayhem-pay",
    "crates/mayhem-proto",
    "crates/mayhem-windows-sandbox",
    "crates/mayhemd",
    "services/paygate",
]
exclude = ["third_party/xet-core"]

[workspace.package]
version = "0.2.58"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

[patch.crates-io]
# Keep the existing llama-cpp-rs API while pinning the reviewed ternary Q2_0
# engine source used by the Bonsai artifact family.
llama-cpp-2 = { git = "https://github.com/Trac-Systems/openmayhem-llama-cpp-rs", rev = "7f15e87e3cb0f636e236243e6ee4fc2a4c357277" }
llama-cpp-sys-2 = { git = "https://github.com/Trac-Systems/openmayhem-llama-cpp-rs", rev = "7f15e87e3cb0f636e236243e6ee4fc2a4c357277" }
# Includes bounded reconstruction-only retries for intermittent CAS 401s and
# suffix-resume for truncated range responses. See third_party/xet-core/UPSTREAM.
xet-client = { path = "third_party/xet-core/xet_client" }
xet-core-structures = { path = "third_party/xet-core/xet_core_structures" }
xet-runtime = { path = "third_party/xet-core/xet_runtime" }

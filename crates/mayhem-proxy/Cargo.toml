[package]
name = "mayhem-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
bytes = "1"
ed25519-dalek = "2"
httpdate = "1"
getrandom = "0.3"
ipnet = { version = "2", features = ["serde"] }
jsonschema = { version = "0.53.0", default-features = false }
mayhem-proto = { path = "../mayhem-proto" }
mayhem-bridge = { path = "../mayhem-bridge" }
redb = "=3.1.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "signal", "process", "io-util"] }
url = "2"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "test-util"] }

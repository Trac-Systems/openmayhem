[package]
name = "mayhem-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mayhem-gateway"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = "2"
hex = "0.4"
mayhem-proto = { path = "../mayhem-proto" }
thiserror = "2"

[dev-dependencies]
mayhem-enclave = { path = "../mayhem-enclave" }
tempfile = "3"

[package]
name = "mayhem-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
dashboard-workbench = []

[[bin]]
name = "mayhem-gateway"
path = "src/main.rs"

[[bin]]
name = "mayhem-dashboard-workbench"
path = "src/bin/mayhem-dashboard-workbench.rs"
required-features = ["dashboard-workbench"]

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
blake3 = "1"
ed25519-dalek = "2"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
mayhem-bridge = { path = "../mayhem-bridge" }
mayhem-attestation = { path = "../mayhem-attestation" }
mayhem-proto = { path = "../mayhem-proto" }
rustfft = "=6.4.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "util"] }
url = "2.5"
wait-timeout = "0.2"

[dev-dependencies]
aes = "0.8"
anyhow = "1"
cfb-mode = "0.8"
hmac = "0.12"
mayhem-bridge = { path = "../mayhem-bridge" }
mayhem-enclave = { path = "../mayhem-enclave" }
rand_chacha = "0.3"
rand_core = "0.6"
rsa = { version = "0.9", default-features = false, features = ["sha2", "std", "u64_digit"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

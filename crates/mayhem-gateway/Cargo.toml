[package]
name = "mayhem-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
dashboard-workbench = []

[[bin]]
name = "mayhem-gateway"
path = "src/main.rs"

[[bin]]
name = "mayhem-dashboard-workbench"
path = "src/bin/mayhem-dashboard-workbench.rs"
required-features = ["dashboard-workbench"]

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
blake3 = "1"
ed25519-dalek = "2"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jsonwebtoken = "9.3"
mayhem-bridge = { path = "../mayhem-bridge" }
mayhem-proto = { path = "../mayhem-proto" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "util"] }
wait-timeout = "0.2"

[dev-dependencies]
anyhow = "1"
mayhem-bridge = { path = "../mayhem-bridge" }
mayhem-enclave = { path = "../mayhem-enclave" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

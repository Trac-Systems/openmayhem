[package]
name = "mayhem-attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
aes = "0.8"
base64 = "0.22"
cfb-mode = "0.8"
hex = "0.4"
hmac = "0.12"
mayhem-proto = { path = "../mayhem-proto" }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "expose-field", "pkcs8", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", default-features = false, features = ["sha2", "std", "u64_digit"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
url = "2"
zeroize = "1"

[dev-dependencies]
rand_chacha = "0.3"

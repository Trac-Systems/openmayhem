[package]
name = "mayhem-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["llama-cpp"]
ace-step = ["dep:flate2", "dep:mayhem-enclave", "dep:tar"]
chatterbox = ["dep:mayhem-enclave"]
comfyui = ["dep:flate2", "dep:mayhem-enclave", "dep:tar"]
sulphur = ["dep:mayhem-enclave", "llama-cpp"]
llama-cpp = ["dep:encoding_rs", "dep:llama-cpp-2", "dep:wait-timeout", "llama-cpp-2/llguidance", "llama-cpp-2/mtmd"]
llama-cpp-cuda = ["llama-cpp", "llama-cpp-2/cuda"]
llama-cpp-metal = ["llama-cpp", "llama-cpp-2/metal"]
llama-cpp-openmp = ["llama-cpp", "llama-cpp-2/openmp"]
llama-cpp-static-openmp = ["llama-cpp", "llama-cpp-2/static-openmp"]
llama-cpp-vulkan = ["llama-cpp", "llama-cpp-2/vulkan"]
mlx = []
needle = ["dep:mayhem-enclave"]
trt-llm = []
transformers-asr = []
vllm = []

[dependencies]
base64 = "0.22"
blake3 = "1"
encoding_rs = { version = "0.8", optional = true }
flate2 = { version = "1", optional = true }
jsonschema = { version = "0.53.0", default-features = false }
llama-cpp-2 = { version = "0.1.150", optional = true, default-features = false, features = ["common", "sampler"] }
mayhem-enclave = { path = "../mayhem-enclave", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", optional = true }
thiserror = "2"
wait-timeout = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

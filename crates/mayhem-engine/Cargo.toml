[package]
name = "mayhem-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["llama-cpp"]
llama-cpp = ["dep:encoding_rs", "dep:llama-cpp-2", "llama-cpp-2/llguidance"]
llama-cpp-cuda = ["llama-cpp", "llama-cpp-2/cuda"]
llama-cpp-metal = ["llama-cpp", "llama-cpp-2/metal"]
llama-cpp-vulkan = ["llama-cpp", "llama-cpp-2/vulkan"]
mlx = []

[dependencies]
encoding_rs = { version = "0.8", optional = true }
llama-cpp-2 = { version = "0.1.150", optional = true, features = ["sampler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

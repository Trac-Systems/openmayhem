[project]
name = "openmayhem-needle-runtime-cpu-arm64"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
    "numpy==1.26.4",
    "safetensors==0.5.3",
    "sentencepiece==0.2.1",
    "torch==2.9.1",
    "transformers==5.2.0",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

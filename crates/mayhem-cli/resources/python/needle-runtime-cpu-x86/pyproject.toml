[project]
name = "openmayhem-needle-runtime-cpu-x86"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
    "numpy==1.26.4",
    "safetensors==0.5.3",
    "sentencepiece==0.2.1",
    "torch==2.9.1+cpu",
    "transformers==5.2.0",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[package]
name = "mayhem-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mayhem"
path = "src/main.rs"

[features]
default = []
llama-cpp-cuda = ["mayhem-engine/llama-cpp-cuda"]
llama-cpp-openmp = ["mayhem-engine/llama-cpp-openmp"]
llama-cpp-static-openmp = ["mayhem-engine/llama-cpp-static-openmp"]
llama-cpp-vulkan = ["mayhem-engine/llama-cpp-vulkan"]

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = "1"
getrandom = "0.3"
mayhem-bridge = { path = "../mayhem-bridge" }
mayhem-enclave = { path = "../mayhem-enclave" }
mayhem-engine = { path = "../mayhem-engine", features = ["mlx", "trt-llm", "vllm"] }
mayhem-gateway = { path = "../mayhem-gateway" }
mayhem-hwprobe = { path = "../mayhem-hwprobe" }
mayhem-proto = { path = "../mayhem-proto" }
fs2 = "0.4"
indicatif = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
toml = "0.8"

[package]
name = "mayhem-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mayhem"
path = "src/main.rs"

[features]
default = []
comfyui = ["mayhem-engine/comfyui"]
llama-cpp-cuda = ["mayhem-engine/llama-cpp-cuda"]
llama-cpp-metal = ["mayhem-engine/llama-cpp-metal"]
llama-cpp-openmp = ["mayhem-engine/llama-cpp-openmp"]
llama-cpp-static-openmp = ["mayhem-engine/llama-cpp-static-openmp"]
llama-cpp-vulkan = ["mayhem-engine/llama-cpp-vulkan"]

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = "1"
getrandom = "0.3"
hf-hub = { version = "=1.0.0", features = ["blocking"] }
# hf-hub uses this crate transitively. Enabling this feature prevents a second
# model-sized chunk cache beside Mayhem's verified artifact cache.
hf-xet = { version = "=1.5.3", features = ["no-default-cache"] }
mayhem-bridge = { path = "../mayhem-bridge" }
mayhem-attestation = { path = "../mayhem-attestation" }
mayhem-enclave = { path = "../mayhem-enclave" }
mayhem-engine = { path = "../mayhem-engine", features = ["ace-step", "chatterbox", "mlx", "needle", "sulphur", "transformers-asr", "trt-llm", "vllm"] }
mayhem-gateway = { path = "../mayhem-gateway" }
mayhem-hwprobe = { path = "../mayhem-hwprobe" }
mayhem-proto = { path = "../mayhem-proto" }
fs2 = "0.4"
indicatif = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml_serde = "0.10.4"
semver = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
toml = "0.8"
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
sysinfo = "0.38"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }

[package]
name = "mayhem-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mayhem"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = "1"
mayhem-bridge = { path = "../mayhem-bridge" }
mayhem-enclave = { path = "../mayhem-enclave" }
mayhem-engine = { path = "../mayhem-engine", features = ["mlx", "trt-llm"] }
mayhem-gateway = { path = "../mayhem-gateway" }
mayhem-hwprobe = { path = "../mayhem-hwprobe" }
mayhem-proto = { path = "../mayhem-proto" }
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
toml = "0.8"

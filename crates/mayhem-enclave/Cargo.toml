[package]
name = "mayhem-enclave"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mayhem-enclave"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
hex = "0.4"
hkdf = "0.12"
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

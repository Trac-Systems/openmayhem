[package]
name = "mayhem-enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mayhem-enclave"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
hkdf = "0.12"
mayhem-proto = { path = "../mayhem-proto" }
mayhem-windows-sandbox = { path = "../mayhem-windows-sandbox" }
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = "0.5"

[dev-dependencies]
tempfile = "3"
